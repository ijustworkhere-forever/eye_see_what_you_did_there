<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EyeSee Control Panel</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>EyeSee</h1>

    <section id="joystick-section">
        <h2>Look</h2>
        <div id="joystick-pad"><div id="joystick-knob"></div></div>
    </section>

    <section id="actions-section">
        <h2>Actions</h2>
        <button id="blink-btn">Blink</button>
        <button id="wink-left-btn">Wink Left</button>
        <button id="wink-right-btn">Wink Right</button>
        <button id="sleep-btn">Sleep</button>
        <button id="wake-btn">Wake</button>
    </section>

    <section id="expression-section">
        <h2>Expression</h2>
        <button data-expression="Neutral">Neutral</button>
        <button data-expression="Happy">Happy</button>
        <button data-expression="Curious">Curious</button>
        <button data-expression="Sleepy">Sleepy</button>
        <button data-expression="Angry">Angry</button>
        <button data-expression="Surprised">Surprised</button>
    </section>

    <section id="calibration-section">
        <h2>Calibration</h2>
        <div id="calibration-channels">
            <button data-channel="lr">LR</button>
            <button data-channel="ud">UD</button>
            <button data-channel="tl">TL</button>
            <button data-channel="bl">BL</button>
            <button data-channel="tr">TR</button>
            <button data-channel="br">BR</button>
        </div>
        <form id="calibration-form">
            <label>Min pulse (µs) <input type="number" id="cal-min" min="500" max="2500" required /></label>
            <label>Max pulse (µs) <input type="number" id="cal-max" min="500" max="2500" required /></label>
            <label>Neutral pulse (µs) <input type="number" id="cal-neutral" min="500" max="2500" required /></label>
            <label>Mechanical offset <input type="number" id="cal-offset" required /></label>
            <label><input type="checkbox" id="cal-inverted" /> Inverted</label>
            <label><input type="checkbox" id="cal-mirrored" /> Mirrored</label>
            <button type="submit" id="cal-save-btn">Save</button>
        </form>
        <p id="calibration-status"></p>
    </section>

    <section id="diagnostics-section">
        <h2>Diagnostics</h2>
        <dl>
            <dt>Connection</dt>
            <dd id="diag-connection">disconnected</dd>
            <dt>State</dt>
            <dd id="diag-state">-</dd>
            <dt>Look</dt>
            <dd id="diag-look">-</dd>
            <dt>Lids (UL / LL / UR / LR)</dt>
            <dd id="diag-lids">-</dd>
            <dt>Uptime</dt>
            <dd id="diag-uptime">-</dd>
        </dl>
    </section>

    <script src="app.js"></script>
</body>
</html>
