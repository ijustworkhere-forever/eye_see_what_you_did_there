[platformio]
; `native` is a test-only environment (it has no firmware to produce), so a bare
; `pio run` builds just the real target. Run the host tests with
; `pio test -e native`.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    bblanchon/ArduinoJson@^7.0.0
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    knolleary/PubSubClient@^2.8.0
    tbekas/BLE-Gamepad-Client@^0.12.1
board_build.filesystem = littlefs

[env:native]
platform = native
build_flags = -std=c++17
test_filter = test_native
; The native env exists only to run host-side unit tests. Exclude src/ (main.cpp
; is Arduino-only) and the Arduino-dependent libraries so a bare `pio run`
; (which builds every environment) doesn't try to compile them for the host.
; MotionHardware is deliberately NOT ignored: EyeController.h includes
; IServoOutput.h from it, which the native tests genuinely need. Protocol is
; deliberately NOT ignored: it's pure JSON logic (via the portable ArduinoJson),
; and its native tests are how this milestone verifies request/response encoding.
; Storage is deliberately NOT ignored either, for the same reason as MotionHardware:
; IStorage.h has zero Arduino dependency and FakeStorage.h (a native test double)
; needs to include it normally; PreferencesStore.h/.cpp (the Arduino-bound
; implementation) are #ifdef ARDUINO-guarded instead, matching Pca9685ServoOutput.h's pattern.
build_src_filter = -<*>
lib_ignore = Logger, Networking, OTA
lib_deps = bblanchon/ArduinoJson@^7.0.0
