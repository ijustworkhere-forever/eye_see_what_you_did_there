name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Provide placeholder WiFi credentials
        run: cp include/WifiCredentials.h.example include/WifiCredentials.h

      - name: Build firmware (esp32dev)
        run: pio run -e esp32dev

      - name: Run unit tests (native)
        run: pio test -e native

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: clang-format --dry-run --Werror $(find lib src test -name '*.h' -o -name '*.cpp')

      - name: Generate compile_commands.json
        run: pio run -t compiledb -e esp32dev

      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy

      - name: Run clang-tidy
        run: clang-tidy -p . $(find lib src -name '*.cpp')
        continue-on-error: true
